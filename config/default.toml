# Default settings for the DMS heatmap pipeline.
#
#   dms-heatmap --config config/default.toml
#
# Every key here matches a command line flag (dashes or underscores both work),
# and any flag given on the command line overrides the value set here.
# The settings actually used are recorded in results/run_manifest.json.

[dms_heatmap]

# --- input / output -------------------------------------------------------
input = "data/raw"       # a file, or a folder searched recursively
output = "results"
patterns = ["*.tsv", "*.csv"]

# --- quality filtering ----------------------------------------------------
# Applied before the anchors are computed. Variants are dropped if ANY
# replicate has fewer than this many input reads. 0 disables filtering.
#
# Set this deliberately. In tna1, 34 % of variants have fewer than 20 input
# reads in at least one replicate; their replicate-to-replicate SD is about
# 0.55 on the normalised scale against 0.25 for variants above 100 reads, so
# they contribute mostly sampling noise to the figure. 20 is a common
# threshold, but it is a judgement about your libraries, not a universal
# constant, so the default here is off.
min_input_count = 0

# Blank variants measured in fewer than this many replicates.
min_replicates = 1

# --- normalisation --------------------------------------------------------
# Wild type = 1, nonsense = 0, anchored per replicate.
# "median" (default) or "mean".
anchor_statistic = "median"

# --- colour scale ---------------------------------------------------------
# Everything at or below lower_quantile takes the deepest red; everything at
# or above upper_quantile takes the deepest blue.
lower_quantile = 0.10
upper_quantile = 0.90

# Where neutral grey sits: "wt" (1.0), "none" for a plain ramp between the
# limits, or a number such as 0.5.
center = "wt"

# One colour scale pooled across every dataset in the run (true), or limits
# from each dataset's own distribution (false).
shared_scale = false

# --- figure ---------------------------------------------------------------
block_size = 100          # positions per stacked block
aa_order = "chemistry"    # "chemistry" or "alphabetical"
include_stops = true      # show the nonsense row
tick_every = 10           # position axis tick interval
mark_wild_type = true     # dot the wild-type residue in each column
formats = ["png", "pdf"]

# --- secondary structure --------------------------------------------------
# Two SSDraw-style strips under each block of the heatmap, sharing its x axis:
# helices as coiled ribbons, strands as arrows, loops as thin bars, and a
# hairline where the model does not cover the position. Both carry the heatmap's
# own colour scale, so a red helix turn means what a red cell means.
#
# A file, or a folder searched recursively, matched to a dataset by filename
# (tna1.pdb, tna1_alphafold.cif, TNA1.dssp all belong to dataset tna1).
# Accepts .dssp, .pdb, .ent, .cif, .mmcif and .ss; a coordinate file with no
# HELIX/SHEET or _struct_conf records needs mkdssp on PATH. Unset = no strips.
# structures = "data/structures"

# false ignores `structures` entirely.
structure_tracks = true

# The residue whose substitution colours the first strip. Proline is the
# default because it is the one substitution whose effect is a statement about
# the backbone: it cannot donate a backbone hydrogen bond and it kinks the
# chain, so an intolerant helix or strand shows up as a red element while the
# loops either side stay pale.
structure_residue = "P"

# Average nonsense variants into the second (mean) strip as well as
# substitutions. Off by default: a stop is not one substitution among twenty --
# its effect grows with how much of the protein it removes, so including it
# would tilt every position's mean by an amount that says more about where the
# position sits in the sequence than about the residue.
structure_mean_include_stops = false

# Added to the structure's residue numbers to reach dataset positions. Unset
# (the default) finds the offset by matching the model's own sequence to the
# assayed protein, and refuses to draw a structure it cannot place -- a
# silently shifted structure track is worse than none.
# structure_offset = 0

# Which chain to read from a multi-chain structure. Unset takes the first.
# structure_chain = "A"

# --- distribution figure --------------------------------------------------
# Fitness histogram of the three variant classes: missense (blue), synonymous
# (green), nonsense (red). This is the normalisation's own sanity check --
# synonymous should pile up on 1 and nonsense on 0.
distribution = true

# Kernel bandwidth multiplier for the smooth density curve. 1.0 is Silverman's
# rule of thumb per class; above 1 is smoother, below 1 follows the data more
# closely. 0 draws a step histogram instead of a curve.
distribution_smoothing = 1.0

# Reference bin width for the y axis: the curve's height is "variants per this
# many fitness units", so the axis still reads as counts. Also the bin count
# used when distribution_smoothing = 0.
distribution_bins = 60

# "overlay" puts all three on one pair of axes (what you usually want);
# "facet" stacks them in panels sharing the x axis, each with its own count
# axis, which is the fix when one class dwarfs the others. In tna1 missense
# outnumbers nonsense 18:1, so the nonsense peak is a low bump in overlay.
distribution_layout = "overlay"

# Quantile trimmed from each end to set the axis range. At 0.001 a handful of
# noisy outliers stretch tna1's axis out to 6.3 and squash the real structure;
# 0.005 gives -0.86 to 3.07. Trimmed variants are never dropped from the
# calculation: in step mode they are counted in the end bins, and in smooth
# mode they still contribute to the curve near the edge (the kernel is
# evaluated on a padded grid) -- they are simply off the visible axis, and the
# caption says how many.
distribution_trim = 0.005

# --- outputs --------------------------------------------------------------
write_tables = true       # normalised.tsv and matrix.tsv alongside the figures
